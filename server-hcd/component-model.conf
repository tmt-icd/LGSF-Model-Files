subsystem = LGSF
component = server
componentType = HCD
modelVersion = "2.0"

title = LGSF Server HCD

description = """Each Server HCD controls and monitors a server (computer).

Each server runs a Server HCD to monitor server status, including:

- Power consumption.
- Temperature.
- CPU Load.
- Memory consumption.

Note: in case a server stops responding (e.g., kernel panic), it is the
responsibility of the telescope operator to reboot the server using IPMI or
reboot the server manually. This can be implemented on the Engineering GUI.

The containers and standalone Assemblies or HCDs are managed by the CSW Host
configure application using configuration files."""
