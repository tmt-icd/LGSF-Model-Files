subsystem = LGSF
component = lp
componentType = Assembly
modelVersion = "2.0"

title = LGSF Low Power Assembly
#prefix = lgsf.lb

description = """The Low Power Assembly is responsible for enabling or disabling the low power
mode module. It slides in the low power module linear stage and rotates the HWP
according to configurations determined during calibration to achieve the desired
low power value.

This assembly also monitors the state of other assemblies and publishes the
overall BTO state."""
