subsystem = LGSF
component = lp
componentType = Assembly
modelVersion = "4.0"

title = LGSF Low Power Assembly
#prefix = lgsf.lb

description = """The Low Power Assembly is responsible for enabling or disabling the
low power mode modules of each Laser Bench. For each laser, it slides in the low power
module linear stage to achieve the desired low power value.  Typically, a single command
is used to move all stages in (to achieve low power mode) or out (to achieve full power)
together in a coordinated fashion.  Engineering commands are provided to move each stage
individually.

In addition, a command is provided to rotate the quarter-wave plate on each bench the
tunes the output of each laser to the desired value.  The best angle is determined in a
calibration routine, and then it does not move unless calibration is needed again; that
is, it is not expected to move during observing.
"""
