subsystem = LGSF
component = lp
description = Low Power Assembly commands.

receive = [
  {
    name            = init
    description     = Initialize the Low Power Assembly
  }
  {
    name            = datumSingleBench
    description     = Datum the mechanisms of a single laser banch. (engineering)
    args = [
      {
        name        = datumStage
        description = Datum the low power module linear stage if true
        type        = boolean
      }
      {
        name        = datumQwp
        description = Datum the quarter wave plate if true
        type        = boolean
      }
      {
        name        = laserBench
        description = Laser Bench for which to datum mechanisms.
        enum        = [LB1, LB2, LB3, LB4, LB6, LB7, LB8, LB9]
      }
    ]
  }
  {
    name            = datumAllBenches
    description     = Datum the mechanisms for all laser benches.
    args = [
      {
        name        = datumStage
        description = Datum the low power module linear stage for all laser benches if true
        type        = boolean
      }
      {
        name        = datumQwp
        description = Datum the quarter wave plate for all laser benches if true
        type        = boolean
      }
    ]
  }
  {
    name            = select
    description     = Configure all low power mode stages
    args = [
      {
        name        = enabled
        description = Insert or remove all low power stage from beam
        enum        = [NOOP, IN, OUT]
      }
    ]
  }
  {
    name            = selectSingle
    description     = Configure one low power mode stage (engineering)
    args = [
      {
        name        = enabled
        description = Insert or remove all low power stage from beam
        enum        = [NOOP, IN, OUT]
      }
      {
        name        = laserBench
        description = Laser Bench for which to move mechanism.
        enum        = [LB1, LB2, LB3, LB4, LB6, LB7, LB8, LB9]
      }
    ]
  }
  {
    name		    = moveQwp
    description		 = Move QWP angle of a single bench (calibration)
    args = [
      {
        name        = angle
        description = input value for QWP angle
        type      = double
        units     = degree
      }
      {
        name        = laserBench
        description = Laser Bench for which to move the mechanism.
        enum        = [LB1, LB2, LB3, LB4, LB6, LB7, LB8, LB9]
      }
    ]
  }
]
