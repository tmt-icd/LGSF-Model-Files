subsystem = LGSF
component = lp
  
publish {
  events = [
    {
      name        = status
      description = status for Low Power Assembly
      archive     = false
      attributes  = [
        {
          name = cmd
          description = Command state.
          enum = [UNINITIALIZED, READY, BUSY]
        }
        {
          name = debug
          description = Current debug message level.
          enum = [DEBUG, INFO, WARN, ERROR]
        }
        {
          name = stage
          description = Position of low power stage
          enum = [IN, OUT, INTERMEDIATE, UNKNOWN]
        }
      ]
    }
    {
      name        = stagePosition
      description = Position of low power stage
      archive     = true
      maxRate        = 0.01
      attributes = [
        {
          name = position
          description = Position of low power stage
          enum = [IN, OUT, INTERMEDIATE, UNKNOWN]
        }
      ]
    }
    {
      name        = lowPowerSetting
      description = """
         Settings for low power mode, giving the QWP angle and what percentage of full power is
         transmitted in of low power mode.  These values are set during calibration and
         aren't expected to change during observing.
        """
      archive     = true
      maxRate     = 0.01
      attributes = [
        {
          name = ratio
          description = low power ratio (percentage of foll power)
          type = double
          units = percent
        }
        {
          name = angle
          description = angle of QWP
          type = double
          units = degree
        }
      ]
    }
    {
      name            = cmdStatus
      description     = Recent command status. (engineering)
      maxRate         = 0.1
      archive         = false
      attributes      = [
        {
          name        = cmd
          description = Recent command name.
          type        = string
        }
        {
          name        = args
          description = Recent command arguments. Empty string if no arguments are supplied.
          type        = string
        }
        {
          name        = caller
          description = Recent command caller (if available).
          type        = string
        }
        {
          name        = runId
          description = Run ID associated with the recent command.
          type        = integer 
        }
        {
          name        = ack
          description = Recent command acknowledgement status.
          enum        = [ ACCEPTED, REJECTED ]
        }
        {
          name        = ackMsg
          description = Recent command acknowledgement message. Empty string if acknowledgement is ACCEPTED.
          type        = string
        }
        {
          name        = comp
          description = Recent command completion status.
          enum        = [ INPROGRESS, SUCCESS, FAILED, INTERRUPTED, REJECTED ]
        }
        {
          name        = compMsg
          description = Recent command completion message. Empty string if completion is INPROGRESS or SUCCESS.
          type        = string
        }
      ]
    }
  ]
}
