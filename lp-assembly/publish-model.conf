subsystem = LGSF
component = lp
  
publish {
  events = [
    {
      name        = status
      description = status for Low Power Assembly
      archive     = false
      parameters  = [
        {
          name = cmd
          description = Command state.
          enum = [UNINITIALIZED, READY, BUSY]
        }
        {
          name = debug
          description = Current debug message level.
          enum = [DEBUG, INFO, WARN, ERROR]
        }
        {
          name = stage
          description = Position of low power stage
          enum = [IN, OUT, INTERMEDIATE, UNKNOWN]
        }
      ]
    }
    {
      name        = stagePosition
      description = Position of low power stage
      archive     = true
      maxRate        = 0.01
      parameters = [
        {
          name = position
          description = Position of low power stage
          enum = [IN, OUT, INTERMEDIATE, UNKNOWN]
        }
      ]
    }
    {
      name        = lowPowerSetting
      description = """
         The angle of the QWP for each laser bench. These values are set during calibration
         and are not expected to change during observing.
        """
      archive     = true
      maxRate     = 0.01
      parameters = [
        {
          name = angle1
          description = angle of QWP for laser bench 1
          type = double
          units = degree
        }
        {
          name = angle2
          description = angle of QWP for laser bench 2
          type = double
          units = degree
        }
        {
          name = angle3
          description = angle of QWP for laser bench 3
          type = double
          units = degree
        }
        {
          name = angle4
          description = angle of QWP for laser bench 4
          type = double
          units = degree
        }
        {
          name = angle6
          description = angle of QWP for laser bench 6
          type = double
          units = degree
        }
        {
          name = angle7
          description = angle of QWP for laser bench 7
          type = double
          units = degree
        }
        {
          name = angle8
          description = angle of QWP for laser bench 8
          type = double
          units = degree
        }
        {
          name = angle9
          description = angle of QWP for laser bench 9
          type = double
          units = degree
        }
      ]
    }
    {
      name            = cmdStatus
      description     = Recent command status. (engineering)
      maxRate         = 0.1
      archive         = false
      parameters      = [
        {
          name        = cmd
          description = Recent command name.
          type        = string
        }
        {
          name        = args
          description = Recent command arguments. Empty string if no arguments are supplied.
          type        = string
        }
        {
          name        = caller
          description = Recent command caller (if available).
          type        = string
        }
        {
          name        = runId
          description = Run ID associated with the recent command.
          type        = integer 
        }
        {
          name        = ack
          description = Recent command acknowledgement status.
          enum        = [ ACCEPTED, REJECTED ]
        }
        {
          name        = ackMsg
          description = Recent command acknowledgement message. Empty string if acknowledgement is ACCEPTED.
          type        = string
        }
        {
          name        = comp
          description = Recent command completion status.
          enum        = [ INPROGRESS, SUCCESS, FAILED, INTERRUPTED, REJECTED ]
        }
        {
          name        = compMsg
          description = Recent command completion message. Empty string if completion is INPROGRESS or SUCCESS.
          type        = string
        }
      ]
    }
  ]
}
