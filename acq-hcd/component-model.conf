subsystem = LGSF
component = acqhcd
componentType = HCD
modelVersion = "4.0"

title = LGSF Acquisition Camera HCD

description = """The Acquisition Camera HCD controls the camera exposure and data
processing. The coordinates of the identified LGS and NGS are forwarded to the
ACQ Assembly.

The acquisition camera system has an embedded computer that can process the
camera exposure to identify the LGS and NGS and determine their absolute
pointing on sky. The HCD mainly handles configuration and relays identified
information. It can also stream raw pixels to the Engineering GUI."""
