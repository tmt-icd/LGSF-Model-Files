subsystem = LGSF
component = te

subscribe {
  events = [
    {
      subsystem = TCS
      component = TCS LGSF Assembly
      name 		  = kMirrorRotation //for k-mirror rotation
      usage     = "Used to calculate target position for k-mirror to derotate asterism during telescope tracking"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = CurrentPosition //includes zenith angle
      usage     = "Zenith angle used as input for LUTs"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = NewTelescopePosition //includes zenith angle
      usage     = "Zenith angle used as input for LUTs"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = AssemblyState
    }
    {
      subsystem = NFIRAOS
      component = rtc
      name 		= lgsfPointOffset
      requiredRate = 20
    }
    {
      subsystem = LGSF
      component = env
      name      = state
    }
  ]
}
