subsystem = LGSF
component = te
componentType = Assembly
modelVersion = "4.0"

title = LGSF Top End Assembly
#prefix = lgsf.te

description = """The Top End Assembly controls the actuators and monitors PACs of
the asterism generator and Launch Telescope Assembly (LTA) via their HCDs. It
also controls the DSWFS.

The main functions are listed below:

- The Top End Assembly ensures correct asterism geometry and pointing on sky. It
  controls the top end actuators such as AGPA, AGCA, AGFSM, AGFM, KM Rotator,
  LTCM, and LTPM using configurations, LUT, or TCS demands together with
  offloading information passed from the mini RTC HCD.
- It opens/closes the LLT cover.
- It controls the AG FSM rotators to configure the LGSF to the required asterism
  with adjustments from the Diagnostic System WFS (DSWFS) during setup.
- It monitors the top end PACs to obtain beam centering information on optical
  components for calibration, and uses the DSWFS to obtain beam pointing,
  centering, wavefront error, and power measurements using their HCDs."""
