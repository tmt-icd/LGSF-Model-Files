subsystem = LGSF
component = saf

subscribe {
  events = [
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = CurrentPosition
      usage     = "Alt/El and RA/Dec used for LTCS (TBC)"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = NewTelescopePosition
      usage     = "Alt/El and RA/Dec used for LTCS (TBC)"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = AssemblyState
      usage     = "Telescope operational state"
    }
    {
      subsystem = AOESW
      component = lgsf
      name      = state
      usage     = "Check LGSF state to determine if lasers are currently on-sky (TBC)"
    }
  ]
}
