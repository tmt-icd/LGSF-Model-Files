subsystem = LGSF
component = saf
componentType = Assembly
modelVersion = "2.0"

title = LGSF SAF Assembly
#prefix = lgsf.laser

description = """The SAF Assembly monitors the SAF system via the LSC HCD. Other
assemblies (ENV, Power, Shutter) also use the LSC HCD for controlling or
monitoring purposes. The monitored parameters include safety status, fault,
interlock, Aircraft Detection System (ADS) status, Laser Traffic Control System
(LTCS) status and Laser Satellite Avoidance Status (LSAS).

It is TBD whether the Assembly needs to configure the SAF system and in
particular the parameters required for LTCS and LSAS."""
