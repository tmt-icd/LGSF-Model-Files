subsystem = LGSF
component = focusing
componentType = Assembly
modelVersion = "2.0"

title = LGSF Focusing Assembly
#prefix = lgsf.focusing

description = """The Focusing Assembly adjusts the focusing mechanism of the Relay
Lens and Collimator via their HCDs with LUT and spot size measurements.

During operation, the Relay Lens and Collimator focus must be optimized based on
spot size measurements of the AGPA/AGCA PAC (for Relay Lens) and AO system WFS
(for Collimator) to mitigate thermal lensing effects. A gradient descent
algorithm will be used for the optimization.

It is conceivable that a LUT may be built based on temperature measurements
and/or the laser shutter open time that can then augment or replace the spot
size-based closed-loop control."""
