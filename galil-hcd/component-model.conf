subsystem = LGSF
component = galil
componentType = HCD
modelVersion = "2.0"

title = LGSF Galil HCD

description = """Each Galil HCD controls a Galil motion controller to control
servo or stepper motors.

Each Galil HCD communicates with a multi-axis Galil controller to configure
and move individual axes. Each axis can be used by a different Assembly. The
following types of motors are supported:

- Servo motors with encoder feedback will be controlled in closed loop.
- Stepper motors will be controlled in open loop without encoder feedback."""
