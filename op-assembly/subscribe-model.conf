subsystem = LGSF
component = op

subscribe {
  events = [
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = CurrentPosition //includes zenith angle
      usage     = "Zenith angle used as input for LUTs"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = NewTelescopePosition //includes zenith angle
      usage     = "Zenith angle used as input for LUTs"
    }
    {
      subsystem = TCS
      component = TCS PK Assembly
      name      = AssemblyState
    }
    {
      subsystem = LGSF
      component = env
      name      = state
    }
  ]
}
