subsystem = LGSF
component = op
componentType = Assembly
modelVersion = "4.0"

title = Optical Path Assembly
#prefix = lgsf.op

description = """The Optical Path Assembly controls the actuators of the optical
path (LOM, TPM, HEXFM1, HEXFM2), using LUT and/or position measurements from
PACs, to transfer the laser beams to the top end.

The control diagram is described in Section 2.1 of LGSF Adjustment and Control
Algorithm [TMT.AOS.TEC.18.043]
(https://docushare.tmt.org/docushare/dsweb/Services/Document-67700). For
example, the TPM PAC measurement is used to control the LOM, which can be used
to populate a zenith-angle-based LUT. A randomized offset can also be added to
randomize the beam positions on TPM to even out the wear of mirror coating or
avoid defects on specific mirrors. The calibration algorithm of the interaction
matrix (a.k.a. pointing model) from LOM to TPM PAC is described in Section 3.4
PAC based control of LGSF Adjustment and Control Algorithm.

A special case is the beam position on the AGPA. The reference must be
determined from the top end asterism generator calibration and no random
adjustment can be applied."""
