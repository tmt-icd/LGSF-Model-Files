title = LGSF DSWFS HCD
#prefix = lgsf.te

description = """The Diagnostic System WFS HCD controls the camera exposure and
processes the acquired frames to identify subapertures, individual beam
pointing/centering/wavefront error, asterism pointing/centering/clocking error,
and power.

The Diagnostic System WFS (DSWFS) HCD performs the following tasks:

- Configures and controls the DSWFS camera exposure.
- Reads and processes the camera images.
- For each subaperture, computes the total intensity and the CoG of the
  identified subaperture spots.
- Groups subaperture measurements for each laser beam to compute pointing,
  centering, wavefront error, and total intensity (as a power meter).

The algorithm is described in Section 3.2 WFS Measurement of LGSF Adjustment
and Control Algorithm [TMT.AOS.TEC.18.043]
(https://docushare.tmt.org/docushare/dsweb/Services/Document-67700)."""
