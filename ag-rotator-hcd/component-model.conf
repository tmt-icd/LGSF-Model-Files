subsystem = LGSF
component = agrotator
componentType = HCD
modelVersion = "4.0"

title = LGSF AG Rotator HCD

description = """The AG Rotator HCD controls the AG FSM rotator controller.

There are six piezo-based AG FSM rotators to configure the LGSF for a selected
asterism. Two of them can be controlled at a time if they are not next to each
other. The controller is powered off after configuration is finished because the
AG FSM rotator auto-locks once in position."""
