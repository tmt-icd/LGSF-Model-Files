subsystem = LGSF
component = fsm
componentType = HCD
modelVersion = "2.0"

title = LGSF FSM HCD

description = """Each AG FSM HCD configures an AG FSM or AGPA-FSM controller.
However, it does not send real-time position demands for the FSM which is the
task of the real-time controller code running in the mini RTC.

Each FSM HCD configures the power, bandwidth, damping, and notch filters for the
local loop of each FSM controller. FSM position control is handled by the mini
RTC using the analog interface."""
