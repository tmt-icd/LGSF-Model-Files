subsystem = LGSF
component = las
componentType = Assembly
modelVersion = "4.0"

title = LGSF LAS Assembly
#prefix = lgsf.las

description = """The Laser System Assembly coordinates commands and status
reporting for all installed Laser Unit HCDs, as described in the
[LGSF Laser Component Controller SDD TMT.AOS.TEC.22.032]
(https://docushare.tmt.org/docushare/dsweb/Services/Document-95236).

The Laser Component Controller can control any configured set of laser units up
to 8 lasers. The Assembly loads the available laser mask, HCD identifiers,
connection information, and default asterism during initialization. Commands may
operate on a single laser or on the configured asterism, and unavailable lasers
are rejected.

The Assembly aggregates individual Laser Unit state into an asterism state,
tracks target state transitions, forwards simulation and laser control commands
to the Laser Unit HCDs, and publishes asterism status, command status, detune
state, repump fraction, and laser failure alarms."""
