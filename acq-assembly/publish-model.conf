subsystem = LGSF
component = acq

publish {
  events = [
    {
      name            = state
      description     = Assembly state.
      maxRate         = 1
      archive         = false
      attributes      = [
        {
          name        = cmd
          description = Command state
          enum        = [ UNINITIALIZED, READY, BUSY, CONTINUOUS ]
        }
        {
          name        = debug
          description = Current debug message level.
          enum        = [DEBUG, INFO, WARN, ERROR]
        }
        {
          name        = cover
          description = cover status
          enum        = [OPEN, CLOSED, UNKNOWN, ERROR]
        }
        
        {
          name        = exposure
          description = camera exposure Status
          enum        = [IDLE, BUSY, CONTINUOUS, OFF, ERROR]
        }
      ]
    }
    {
      name = coverPosition
      description = Assembly state.
      maxRate = 1
      archive = true
      attributes = [
        {
          name = state
          description = cover status
          enum = [OPEN, CLOSED, UNKNOWN, ERROR]
        }
      ]
    }
    {
      name = exposureState
      description = camera exposure state.
      maxRate = 1
      archive = true
      attributes = [
        {
          name = exposureMode
          description = camera exposure mode
          enum = [SINGLE, CONTINUOUS, OFF, ERROR]
        }
        {
          name = exposureInProgress
          description = camera is currently exposing
          type = boolean
        }
      ]
    }
    {
      name = exposureSettings
      description = camera exposure settings.
      maxRate = 1
      archive = true
      attributes = [
        {
          name        = exposureTime
          description = Exposure time of the camera
          type        = double
          units       = second
        }
        {
          name        = exposureRate
          description = Exposure frame rate of the camera
          type        = double
          units       = hertz
        }
      ]
    }
    {
      name            = cmdStatus
      description     = Recent command status. (engineering)
      maxRate         = 0.1
      archive         = false
      attributes      = [
        {
          name        = cmd
          description = Recent command name.
          type        = string
        }
        {
          name        = args
          description = Recent command arguments. Empty string if no arguments are supplied.
          type        = string
        }
        {
          name        = caller
          description = Recent command caller (if available).
          type        = string
        }
        {
          name        = runId
          description = Run ID associated with the recent command.
          type        = integer 
        }
        {
          name        = ack
          description = Recent command acknowledgement status.
          enum        = [ ACCEPTED, REJECTED ]
        }
        {
          name        = ackMsg
          description = Recent command acknowledgement message. Empty string if acknowledgement is ACCEPTED.
          type        = string
        }
        {
          name        = comp
          description = Recent command completion status.
          enum        = [ INPROGRESS, SUCCESS, FAILED, INTERRUPTED, REJECTED ]
        }
        {
          name        = compMsg
          description = Recent command completion message. Empty string if completion is INPROGRESS or SUCCESS.
          type        = string
        }
      ]
    }
    {
      name            = position
      description     = measured on sky position
      maxRate         = 0.1
      archive         = false
      attributes = [
        {
          name        = lgs
          description = The RA DEC position of each LGS on sky
          type        = array
          units       = arcsec
        }
        {
          name        = ngs
          description = The RA DEC position of NGS used as reference
          type        = array
          units       = arcsec
        }
      ]
    }
  ]
}
