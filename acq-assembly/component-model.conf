subsystem = LGSF
component = acq
componentType = Assembly
modelVersion = "4.0"

title = LGSF Acquisition Camera Assembly
#prefix = lgsf.acq

description = """The Acquisition Camera Assembly controls the acquisition camera and
its cover.

The ACQ Assembly controls the ACQ via its HCD. It provides the following
functions:

- Open or close the cover.
- Set exposure parameters and start or stop exposure.
- Specify LGS asterism geometry.
- Publish the determined LGS asterism pointing/orientation/geometry on sky."""
