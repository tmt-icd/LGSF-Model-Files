subsystem = LGSF
component = env

description = Environmental Sensor Assembly commands.

receive = [
  {
    name            = init
    description     = Initialize the Environmental Sensor Assembly
  }
  {
    name            = laserCooling
    description     = Configure and control laser cooling system
    //completionType      = longRunning //not supported?
    parameters = [
      {
        name        = state
        description = start or stop laserCooling
        enum        = [ON, OFF]
      }
      {
        name        = temperature
        description = Set temperature
        type        = double
        units       = degC
      }
      {
        name        = follow
        description = Track the ambient temperature
        enum 		= [ON, OFF]
      }
    ]
  }
  {
    name            = refrigeration
    description     = Configure and control refrigeration system
    //completionType      = longRunning //not supported?
    parameters = [
      {
        name        = state
        description = start or stop refrigeration system
        enum        = [ON, OFF]
      }
      {
        name        = temperature
        description = Set target temperature
        type        = double
        units       = degC
      }
      {
        // TBC: is this needed or is it redundant with start/stop?
        name        = follow
        description = Track the target temperature
        enum 		= [ON, OFF]
      }
    ]
  }
  {
    name            = pressurization
    description     = Configure and control pressurization system
    //completionType      = longRunning //not supported?
    parameters = [
      {
        name        = state
        description = start or stop pressurization system
        enum        = [ON, OFF]
      }
      {
        name        = pressure
        description = Set target pressure
        type        = double
        units       = bar // pascal?
      }
      {
        // TBC: is this needed or is it redundant with start/stop?
        name        = follow
        description = Track the target pressure
        enum 		= [ON, OFF]
      }
    ]
  }
]
