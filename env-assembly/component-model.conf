subsystem = LGSF
component = env
componentType = Assembly
modelVersion = "2.0"

title = LGSF Environmental Sensor Assembly
#prefix = lgsf.laser

description = """The Environment Assembly monitors the environmental parameters
(e.g., temperature, humidity and pressure of the optical enclosures and
electronics enclosures), configures and monitors the REFR system of the
electronics enclosures and the pressurization system, controls and monitors the
laser cooling system via the Galil RIO HCDs as well as monitors the server
health. It publishes the
measurements and raises alarms when abnormal conditions occur."""
