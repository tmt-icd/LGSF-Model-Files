subsystem = LGSF
component = lsc
componentType = HCD
modelVersion = "4.0"

title = LGSF LSC HCD

description = """The LSC HCD communicates with the Laser Safety Controller PLC to
send demands and monitor the status of various components.

It uses EtherNet/IP to pass heartbeat signals, send demands, and monitor status.

The demands include:

- Open/close BDM.
- Turn LGSF power supplies on/off.
- Turn laser cooling system on or off and/or set the temperature/pressure.
- Control refrigerant system.
- Control pressurization system.

The status include:

- Safety system status and interlocks including Laser Units safety status and
  interlocks.
- Environmental sensors status.
- BDM status.
- Low power mode stage status.
- LLT cover status.

Other functions include:

- Parse console messages for heartbeat, detection events, and log them."""
