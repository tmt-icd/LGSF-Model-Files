subsystem = LGSF
component = pac

description = """Prealignment camera HCD

	The configuration file shall provide the following

	1.	Connection information and configuration for the PAC.
	2.	Name of optical element [enum: LOM1, LOM2, LOM3, LOM4, LOM6, LOM7, LOM8, LOM9, TPM, HEXFM1, HEXFM2, AGPA, AGCA, AGAM, AGFM, LTCM, LTPM, L2]
	3.	Target position in local coordinate (on the mirror surface) [vector of 2; unit: pixel].
	4.	Range of beam motion in local coordinate [vector of 2; unit: pixel]
  5.	Subwindow size and location
	6.	Optional: Range of randomized beam target position in local coordinate [vector of 2; unit: pixel]
	7.	Optional: Mapping matrix from mirror coordinate to a reference coordinate and unit [matrix of 2x2]. Default to identity matrix if not supplied.

"""

receive = [  
  {
    name            = exposure
    description     = set the PAC exposure time and mode
    parameters = [
      {
        name        = enabled
        description = Exposure enabled
        type        = boolean
      }
      {
        name        = exposureTime
        description = Exposure time
        type        = double
        units       = second
      }
      {
        name        = exposureRate
        description = Exposure frame rate
        type        = double
        units       = hertz
      }
    ]
  }

  {
    name            = calib
    description     = Determine the PAC read out window
    parameters = [
      {
        name        = exposureTime
        description = Exposure time
        type        = double
        units       = second
      }
      {
        name        = led
        description = Turn on led using PAC strobe signal
        type        = boolean
      }
      {
        name        = store
        description = Whether to store the configuration result into configuration database
        type		    = boolean
      }
    ]
  }
]
