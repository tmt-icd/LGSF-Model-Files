modelVersion = "4.0"

title = LGSF Prealignment Camera HCD
#prefix = lgsf.pac

description = """Each Pre-alignment Camera HCD controls the exposure of a PAC,
reads the exposure frames, and processes them to determine the laser beam
position errors on the mirror(s) (based on reference position(s)). It also
determines the mirror boundary during calibration with ambient light
illumination.

The Pre-Alignment Cameras (PACs) are used to determine the positions of the laser
beams on the optical components (e.g., mirrors, lenses) using scattered light.
Each HCD communicates with a PAC. The expected exposure frame rate will be 1 Hz
or less for CoG calculations. The HCD can also stream raw pixels to the
Engineering GUI for image display which is useful during manual alignment.

The optical component boundary is determined using ambient light by turning on a
LED momentarily (triggered by PAC strobe signal). Each PAC may image one or
multiple optical components. In the latter case, the frame will be split into
multiple regions based on each component's boundary information. Within each
region, there should be only a single beam (or overlapped beams treated as a
single beam), from which the CoG (or matched filters if needed) will be
calculated to determine the beam position (in pixel coordinates). The total
intensity per region is also calculated which is converted to laser power from
the configured throughput value.

The PAC HCD computes beam position measurements either in the local coordinate
(defined on the optical surface along minor and major axis) or in the reference
coordinate if a mapping matrix is provided. The mirror tip/tilt to PAC
measurement interaction matrix and its inverse link the control and sensor
together.

The algorithm is described in Section 3.1 CoG Measurement of LGSF Adjustment and
Control Algorithm [TMT.AOS.TEC.18.043]
(https://docushare.tmt.org/docushare/dsweb/Services/Document-67700)."""
