subsystem = LGSF
component = pac

publish {
  events = [
    {
      name            = status
      description     = status
      archive         = true
      #archiveRate     = 0.1
      attributes = [
        {
          name        = state
          description = assembly state
          enum        = [READY, BUSY, UNINITIALIZED]
        }
        {
          name        = list
          description = list the name of all PACs in order of array index
          type        = array
          items = {
            type = string
          }
        }
        {
          name        = led
          description = status of the LED
          type        = array
          items = {
            enum      = [ON, OFF, ERROR]
          }
        }
        {
          name        = exposure
          description = camera exposure Status
          type        = array
          items = {
            enum      = [IDLE, BUSY, CONTINUOUS, ERROR]
          }
        }
        {
          name        = exposureTime
          description = Exposure time of the camera
          type        = array
          items = {
            type      = double
          }
          units       = second
        }
        {
          name        = stream
          description = Image stream URI
          type        = array
          items = {
            type      = string
          }
        }
        {
          name        = detection
          description = detection of beam and offset
          type        = array
          items = {
            enum      = [SINGLE, CONTINUOUS, STOP]
          }
        }
      ]
    }
    {
      name = exposureState
      description = camera exposure state.
      maxRate = 1
      archive = true
      attributes = [
        {
          name = exposureMode
          description = camera exposure mode
          enum = [SINGLE, CONTINUOUS, OFF, ERROR]
        }
        {
          name = exposureInProgress
          description = camera is currently exposing
          type = boolean
        }
      ]
    }
    {
      name = exposureSettings
      description = camera exposure settings.
      maxRate = 1
      archive = true
      attributes = [
        {
          name        = exposureTime
          description = Exposure time of the camera
          type        = double
          units       = second
        }
        {
          name        = exposureRate
          description = Exposure frame rate of the camera
          type        = double
          units       = hertz
        }
      ]
    }
    // note: only one of centroid or centroid8 is published, depending on what optic pac is looking at.
    {
      name = centroid
      description = "detected beam position, for single centroid measurement"
      archive = true
      attributes = [
        {
          name = position
          description = "x,y position of centroid in mm"
          type = array
          units = millimeter
          dimensions: [2]
          items = {
            type = double
          }
        }
      ]
    }
    {
      name = centroid8
      description = "detected beam positions, for centroid measurement of 8 beams"
      archive = true
      attributes = [
        {
          name        = positions
          description = "x,y position of all 8 centroids in mm"
          type        = array
          units       = millimeter
          dimensions : [2, 8]
          items = {
            type = double
          }
        }
      ]
    }
  ]
}
