subsystem = LGSF
component = lu
componentType = HCD
modelVersion = "2.0"

title = LGSF Laser Unit
#prefix = lgsf.las

description = """Each Laser Unit HCD controls one laser unit using the TCP/IP
telnet software interface described in the
[LGSF Laser Component Controller SDD TMT.AOS.TEC.22.032]
(https://docushare.tmt.org/docushare/dsweb/Services/Document-95236).

The HCD sends laser control commands for simulation, operational state changes,
abort, detune, repump, and failure reset. It monitors the laser operational
mode, current and target operational state, shutter permissive status, output
power, wavelength, detune and repump status, and laser alarm information.

The Laser Unit HCD reports BAD health when the laser is in service mode or
otherwise unavailable, rejects commands that cannot be executed, publishes
state and command status events for the Laser Assembly, and raises laserFailure
alarms for detected laser failures."""
