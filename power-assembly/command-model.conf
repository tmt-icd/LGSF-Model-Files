subsystem = LGSF
component = power
description = Power Assembly commands.

receive = [
  {
    name            = init
    description     = Initialize the Power Assembly
  }
  {
    name            = select
    description     = turn components on/off according to predefined power states
    args = [
      {
        name        = state
        description = """
                      Predefined power states:

                      - PARKED: almost everything is turned off except the safety system
                      - CALIB_DAYTIME: turn on necessary components for daytime calibration
                      - CALIB_NIGHTTIME: turn on necessary components for nighttime calibration
                      - OPERATION: turn off unnecessary components for normal operation.
                    """
        enum        = [PARKED, CALIB_NIGHT, CALIB_DAYTIME, OPERATION]
      }
    ]
  }
  {
    name            = power
    description     = """
      Manually set the power state of individual components.  Power to all PACs and
      select power supplies can be controlled via remote IO.  Each PAC is identified by
      the optic which it is looking at, which includes each LOM, TPM, HEXFM1, HEXCFM2,
      AGPA, AGCA, AGAM, AGFm, LTCM, LTPM, and LL2.  There are six power supplies in the main
      cabinet that have remote control, and two in the TPA.
      """
      // todo: add ELT2, ELT3, ELT4  power supplies
    args = [
      {
        name        = powerOn
        description = turn power on to selected components (PACs and Power Supplies)
        type        = array
        items = {
          enum = [PAC_LOM1, PAC_LOM2, PAC_LOM3, PAC_LOM4,
                  PAC_LOM6, PAC_LOM7, PAC_LOM8, PAC_LOM9,
                  PAC_TPM, PAC_HEXFM1, PAC_HEXFM2,
                  PAC_AGPA, PAC_AGCA, PAC_AGAM, PAC_AGFM,
                  PAC_LTCM, PAC_LTPM, PAC_L2,
                  TPA_DMC_PWS1, TPA_DMC_PWS2,
                  MAIN_DMC_PWS1, MAIN_DMC_PWS2,
                  MAIN_DMC_PWS3, MAIN_DMC_PWS4,
                  MAIN_DMC_PWS5, MAIN_DMC_PWS6]
        }
      }
      {
        name        = powerOff
        description = turn power off to selected components (PACs and Power Supplies)
        type        = array
        items = {
          enum = [PAC_LOM1, PAC_LOM2, PAC_LOM3, PAC_LOM4,
                  PAC_LOM6, PAC_LOM7, PAC_LOM8, PAC_LOM9,
                  PAC_TPM, PAC_HEXFM1, PAC_HEXFM2,
                  PAC_AGPA, PAC_AGCA, PAC_AGAM, PAC_AGFM,
                  PAC_LTCM, PAC_LTPM, PAC_L2,
                  TPA_DMC_PWS1, TPA_DMC_PWS2,
                  MAIN_DMC_PWS1, MAIN_DMC_PWS2,
                  MAIN_DMC_PWS3, MAIN_DMC_PWS4,
                  MAIN_DMC_PWS5, MAIN_DMC_PWS6]
        }
      }
    ]
  }
]
