subsystem = LGSF
component = power
componentType = Assembly
modelVersion = "2.0"

title = LGSF Power Assembly
#prefix = lgsf.power

description = """The Power Assembly manages power to various components (e.g.,
PSUs) via the Galil RIO HCD.

The power to the various components such as the power supply units (PSU) are
controlled by the Galil RIO Controller to operate solid state relays. The power
to unused components during operation will be turned off by group to minimize
power dissipation. For example, the PACs on LOM and top end (except AGPA/AGCA)
will be turned off during observation after alignment or after calibration is
finished. At the end of nighttime observation, power to other electronics may
also be turned off."""
