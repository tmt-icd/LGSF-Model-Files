subsystem = LGSF
component = state
componentType = Assembly
modelVersion = "4.0"

title = LGSF State Assembly
#prefix = lgsf.state

description = """The State Assembly is responsible for subscribing to the state
and position information published by other LGSF Assemblies, aggregating the
information to calculate the BTO state and the overall LGSF state.

The BTO state is calculated based on the positions of BTO mechanisms as
described in [REQ-3-CC-0196].

This Assembly does not receive or send any commands."""
