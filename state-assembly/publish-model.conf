subsystem = LGSF
component = state

publish {
  events = [
    {
      name            = lgsfState
      description     = """Overall LGSF state.

This is not to be confused with setting the state of the laser system, which is
one component of the LGSF state.

The supported LGSF states are:

- OFFLINE: Used for planned long-term down time or maintenance. In this state,
  all lasers are turned off. The BTO electronics are on, but mechanisms may not
  be datumed yet. If they are, all shutters and covers are closed, and all
  mechanisms are parked.
- STANDBY: Power to the laser system, cooling system, and electronics are turned
  on, but the mechanisms are in their parked positions. Laser shutters remain
  closed.
- READY: The required lasers are turned on with all shutters closed, the
  asterism generator is configured for a dedicated asterism, and the active
  arrays are controlled using their LUTs. The LLT cover is open, and the BDM
  shutter is closed.
- ON_LOW: This state is only used as an intermediate step to transition from
  READY to ON, primarily to prevent stray laser beam light when turning on full
  power. The laser bench low power modules are inserted with low power settings
  (~0.4W), the laser beams are propagated up to the BDM, which stays closed, and
  the active array loops are closed with LUT and PAC measurements.
- READY_CALIB: This state is primarily used for daytime calibration but can be
  used any time. This state is the same as READY, but the LLT cover is closed,
  and the LGSF safety system components are off, except for the LGSF LSC and
  associated safety-rated remote I/O, which are on. This state, along with
  ON_LOW_CALIB, is used instead of READY and ON_LOW, respectively, to improve
  efficiency by eliminating unnecessary motion of the LLT cover, which remains
  closed for daytime calibrations.
- ON_CALIB: This state is primarily used for daytime calibration but can be used
  any time. This state is the same as ON_LOW, but the LLT cover is closed, and
  the LGSF safety system components are off, except for the LGSF LSC and
  associated safety-rated remote I/O, which are on.
- ON: In this state, the lasers are turned on, the laser shutters are open, the
  LLT cover is open, and full power laser beams are propagated up to the BDM,
  which stays closed. The active array loops are closed with LUT and PAC
  measurements.
- OBSERVATION: In this state, the LLT cover is open, the BDM is extracted, and
  the laser beams are propagated to the sky. The uplink tip/tilt (FSM) loops may
  be open or closed, depending on the AO system status.
- UNKNOWN: The state of the LGSF components does not match one of the above
  states."""
      maxRate         = 1
      archive         = true
      parameters      = [
        {
          name        = state
          description = Overall LGSF state.
          enum        = [
            OFFLINE,
            STANDBY,
            READY,
            ON_LOW,
            READY_CALIB,
            ON_LOW_CALIB,
            ON_CALIB,
            ON,
            OBSERVATION,
            UNKNOWN
          ]
        }
      ]
    }
    {
      name            = btoState
      description     = """BTO state calculated from BTO mechanism positions as
defined in [REQ-3-CC-0196].

- OFFLINE: All BTO electronics are turned ON, BTO mechanisms may not be
  datumed, but if they are, they are parked. All control loops are OPEN.
- STANDBY: All BTO electronics are turned ON, all BTO mechanisms are datumed
  and parked, and all control loops are OPEN.
- READY: All BTO electronics are turned ON. The low-power stage is extracted.
  The BTO is configured for the required asterism. The BTO control loops to
  compensate for telescope flexure are enabled using lookup tables. The K-Mirror
  is not in follow mode. The LLT cover is open, but the BDM is closed.
- ON_LOW: All BTO electronics are turned ON. The low-power stage is in the
  low-power position. The BTO is configured for the required asterism. All
  control loops are closed using lookup tables and data from the pre-alignment
  cameras. The K-Mirror is not in follow mode. The LLT cover is open, but the
  BDM is closed.
- READY_CALIB: Same as READY, but LLT cover is closed.
- ON_LOW_CALIB: Same as ON_LOW, but LLT cover is closed.
- ON: All BTO electronics are turned ON. The low-power stage is extracted. The
  BTO is configured for the required asterism. All control loops are closed
  using lookup tables and data from the pre-alignment cameras. The K-Mirror is
  in follow mode, following TCS demands. The LLT cover is open, but the BDM is
  closed.
- OBSERVATION: All BTO electronics are turned ON. The low-power stage is
  extracted. The BTO is configured for the required asterism. All control loops
  are closed using lookup tables and data from the pre-alignment cameras. The
  K-Mirror is in follow mode, following TCS demands. The LLT cover is open and
  the BDM is open.
- UNKNOWN: The state of the BTO components does not match one of the above
  states."""
      maxRate         = 1
      archive         = true
      parameters      = [
        {
          name        = state
          description = BTO state.
          enum        = [
            OFFLINE,
            STANDBY,
            READY,
            ON_LOW,
            READY_CALIB,
            ON_LOW_CALIB,
            ON,
            OBSERVATION,
            UNKNOWN
          ]
        }
      ]
    }
  ]
}
